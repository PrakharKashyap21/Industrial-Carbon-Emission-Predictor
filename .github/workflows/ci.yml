name: Industrial Carbon Emission System CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Pytest Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install reportlab openpyxl pytest pytest-cov

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: ci_cd_test_jwt_secret_key_32bytes_long
        run: |
          cd backend
          pytest tests/ --tb=short

  frontend-build:
    name: Frontend React Compilation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile Production Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Multi-Stage Image Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t industrial-carbon-backend:latest -f docker/backend/Dockerfile .

      - name: Build Frontend Docker Image
        run: |
          docker build -t industrial-carbon-frontend:latest -f docker/frontend/Dockerfile .
