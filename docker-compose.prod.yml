version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carbon_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-industrial_carbon_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: carbon_backend_prod
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - report_storage_prod:/app/storage/reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network_prod

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: carbon_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network_prod

volumes:
  postgres_data_prod:
  report_storage_prod:

networks:
  app_network_prod:
    driver: bridge
