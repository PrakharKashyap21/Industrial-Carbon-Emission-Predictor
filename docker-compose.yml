version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: carbon_postgres
    restart: always
    environment:
      POSTGRES_DB: industrial_carbon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: carbon_backend
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@postgres:5432/industrial_carbon_db
      JWT_SECRET_KEY: industrial_carbon_intelligence_super_secret_jwt_key_32bytes_long
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    volumes:
      - report_storage:/app/storage/reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: carbon_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  report_storage:

networks:
  app_network:
    driver: bridge
